# Every push: check the engine on a computer, build the app, and put the APK on the "dev-build" release
# (Releases on the repo's page: open it on the phone, tap quorum-dev.apk, install).
name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Engine check (the firmware on the Android platform layer, on this computer)
        run: CC=clang sh engine/tests/desktop_check.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build the APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Publish the dev build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk quorum-dev.apk
          gh release delete dev-build --yes --cleanup-tag || true
          gh release create dev-build quorum-dev.apk --prerelease --target "$GITHUB_SHA" \
            --title "Dev build ${{ github.run_number }}" \
            --notes "Built from ${GITHUB_SHA::7}: $COMMIT_MSG"

      - uses: actions/upload-artifact@v4
        with:
          name: quorum-apk
          path: app/build/outputs/apk/release/app-release.apk
